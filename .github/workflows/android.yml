name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'dist/**'
      - 'scripts/android-prepare.mjs'
      - 'tests/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'dist/**'
      - 'scripts/android-prepare.mjs'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Also run the offline Android emulator smoke test'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ledger and prepare bundled web assets
        run: |
          npm test
          node --check scripts/android-prepare.mjs
          node scripts/android-prepare.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android platform and tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned release package
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Check APK identity and permissions
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n '1,5p'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > android-permissions.txt
          cat android-permissions.txt
          if grep -Eq 'android.permission.(INTERNET|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' android-permissions.txt; then
            echo 'Offline app unexpectedly requests network or broad storage access.' >&2
            exit 1
          fi
      - name: Upload unsigned APK for separate release signing
        uses: actions/upload-artifact@v4
        with:
          name: yiri-android-unsigned-1.1.0
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload package permission report
        uses: actions/upload-artifact@v4
        with:
          name: yiri-android-permissions
          path: android-permissions.txt

  smoke:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.smoke_test) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debuggable package for device inspection
        run: |
          node scripts/android-prepare.mjs
          gradle -p android --no-daemon assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise offline ledger, native navigation, and persistent storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node android/scripts/emulator-smoke.mjs
      - name: Keep smoke screenshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yiri-android-smoke
          path: |
            android/smoke-screenshot.png
            android/smoke-report.json
            android/screenshots/*.png
          if-no-files-found: ignore
